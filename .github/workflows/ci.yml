name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**', 'refactor/**', 'test/**', 'perf/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # TreatWarningsAsErrors is on: any analyzer warning fails here.
      - run: dotnet build -c Release --no-restore
      - run: dotnet format whitespace --verify-no-changes --no-restore

  unit:
    name: Unit & architecture
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/DocsAssistant.Architecture.Tests -c Release
      - run: dotnet test tests/DocsAssistant.Domain.Tests -c Release
      - run: dotnet test tests/DocsAssistant.Application.Tests -c Release

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The embedding model (~123 MB) is downloaded on first use and verified by SHA-256. The cache key
      # is the pinned hashes, so changing the model in EmbeddingModelOptions invalidates it.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/docs-assistant/models
          key: e5-small-${{ hashFiles('src/DocsAssistant.Infrastructure/Ai/Embeddings/EmbeddingModelOptions.cs') }}
      # The int8 embedding model runs different ONNX Runtime kernels depending on the CPU's instruction
      # set; recording it makes a numerical difference between runners explainable (ADR-0003).
      - name: CPU
        run: |
          lscpu | grep 'Model name'
          for flag in avx2 avx512f avx512_vnni avx_vnni; do grep -qw "$flag" /proc/cpuinfo && echo "$flag: yes" || echo "$flag: no"; done
      # Real Postgres + pgvector in containers (Docker is preinstalled on ubuntu runners) and the real model.
      - run: dotnet test tests/DocsAssistant.Integration.Tests -c Release

  retrieval-eval:
    name: Retrieval eval (gate)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/docs-assistant/models
          key: e5-small-${{ hashFiles('src/DocsAssistant.Infrastructure/Ai/Embeddings/EmbeddingModelOptions.cs') }}
      # Ingests evals/corpus through the production pipeline, scores evals/datasets/retrieval.jsonl and
      # exits non-zero when a metric drops below evals/thresholds.json. No LLM involved: free to run.
      - run: dotnet run --project evals/DocsAssistant.Evals -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evals/results/

  widget:
    name: Widget (typecheck, size, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Fails when widget.js goes over its gzip budget (scripts/build.mjs).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every API response scripted: streaming, citations, XSS, handoff, errors, a11y (axe), mobile.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: widget-report
          path: widget/playwright-report/

  e2e:
    name: End to end (widget + API + Postgres + Mailpit)
    runs-on: ubuntu-latest
    needs: [build, widget]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/docs-assistant/models
          key: e5-small-${{ hashFiles('src/DocsAssistant.Infrastructure/Ai/Embeddings/EmbeddingModelOptions.cs') }}
      - run: docker compose -f widget/e2e/compose.yaml up -d --wait
      - working-directory: widget
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - run: dotnet build src/DocsAssistant.Api -c Release
      # The real API, as built, with no language model (the public demo's extractive mode).
      - name: Start the API
        run: |
          source widget/e2e/api.env.sh
          nohup dotnet run --project src/DocsAssistant.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:5010/health && exit 0; sleep 2; done
          cat api.log; exit 1
      - working-directory: widget
        run: npm run test:e2e
      - if: failure()
        run: cat api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: widget/playwright-report/
